# Deploy project_page/ to GitHub Pages (https://annchenn.github.io/Manga2Animate/).
# Runs on every push to master that touches the page, or by hand from the Actions tab.
# Repo Settings > Pages > Source must be "GitHub Actions".
name: Deploy project page

on:
  push:
    branches: [master]
    paths:
      - "project_page/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Same exclusions as project_page/.vercelignore
      - name: Collect site files
        run: |
          mkdir -p _site
          rsync -a --delete \
            --exclude "manga2animate figures.pdf" \
            --exclude ".vercelignore" \
            --exclude "static/logo/logo_soft_*" \
            project_page/ _site/
          touch _site/.nojekyll
          du -sh _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
